<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' https://storage.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://images.unsplash.com https://images.pexels.com https://*.pexels.com https://*.googleapis.com; media-src 'self' blob: data: https://translate.google.com https://dict.youdao.com https://api.dictionaryapi.dev; connect-src 'self' https://generativelanguage.googleapis.com https://api.groq.com https://api.dictionaryapi.dev https://api.datamuse.com https://api.pexels.com https://*.peerjs.com wss://*.peerjs.com https://storage.googleapis.com; worker-src 'self' blob:; frame-ancestors 'none';"
    />
    <title>منصة أكسفورد 3000™ - Oxford 3000 CEFR Lexicon</title>
    
    <!-- PWA & Mobile Web App Meta -->
    <meta name="theme-color" content="#060D21" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Oxford 3000" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/svg+xml" href="./icon-192.svg" />
    <link rel="apple-touch-icon" href="./icon-192.svg" />

    <!-- Google Fonts: Clean & High-Legibility Arabic & English Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          const savedTheme = localStorage.getItem('uqu_theme') || localStorage.getItem('oxford3000_theme') || 'brutalism';
          const savedMode = localStorage.getItem('uqu_mode') || localStorage.getItem('oxford3000_mode') || 'light';
          document.documentElement.setAttribute('data-theme', savedTheme);
          document.documentElement.setAttribute('data-mode', savedMode);
        } catch (e) {}
      })();
    </script>
  </head>
  <body className="min-h-screen antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Register Progressive Web App Service Worker
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('./sw.js')
            .then((reg) => {
              console.log('Oxford 3000 PWA Service Worker Registered 🚀', reg.scope);
            })
            .catch((err) => {
              console.log('PWA SW registration notice:', err);
            });
        });
      }
    </script>
  </body>
</html>
