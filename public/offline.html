<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>وضع عدم الاتصال | Oxford 3000™ Offline</title>
  <style>
    :root {
      --bg-page: #0B0F19;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --accent: #3B82F6;
      --card-bg: #1E293B;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .icon {
      font-size: 64px;
      margin-bottom: 20px;
      display: inline-block;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 12px;
      color: #FFFFFF;
    }
    p {
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--accent);
      color: #FFFFFF;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 14px;
      border: none;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }
    .btn:hover {
      background: #2563EB;
      transform: translateY(-2px);
    }
    .badge {
      display: inline-block;
      margin-top: 16px;
      font-size: 12px;
      color: #10B981;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">⚡📶</div>
    <h1>أنت غير متصل بالإنترنت حالياً</h1>
    <p>
      لا تقلق! كافة مفردات <strong>Oxford 3000™</strong> وبطاقات الاستذكار FSRS وقاعدة البيانات مخزنة محلياً في جهازك عبر IndexedDB وتعمل بشكل كامل دون اتصال.
    </p>
    <button class="btn" onclick="window.location.reload()">
      🔄 إعادة المحاولة والعودة للتطبيق
    </button>
    <div>
      <span class="badge">✓ قاعدة بيانات IndexedDB جاهزة محلياً</span>
    </div>
  </div>
</body>
</html>
